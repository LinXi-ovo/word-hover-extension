<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  body { width: 300px; margin: 0; padding: 14px; font: 13px/1.5 "Microsoft YaHei", "Segoe UI", sans-serif; color: #1f2937; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: block; margin-top: 8px; color: #6b7280; font-size: 12px; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; margin-top: 3px; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  button { flex: 1; padding: 7px; border: 0; border-radius: 6px; cursor: pointer; color: #fff; background: #2563eb; }
  button.secondary { background: #6b7280; }
  #status { margin-top: 10px; min-height: 18px; color: #374151; font-size: 12px; }
  .hint { color: #6b7280; font-size: 12px; margin-top: 8px; }
  #diag { margin-top: 8px; font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
  #diag.ok { color: #047857; }
  #diag.err { color: #b91c1c; }
  button:disabled { opacity: .55; cursor: wait; }
  .toggles { margin-top: 12px; border-top: 1px solid #e5e7eb; padding-top: 8px; }
  .switch { display: flex; align-items: center; gap: 8px; margin-top: 6px; color: #1f2937; font-size: 13px; cursor: pointer; }
  .switch input { width: auto; margin: 0; }
  .sub { color: #6b7280; font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
  <h1>Word Hover 释义助手</h1>
  <label>API Key（仅保存在本机）
    <input id="apiKey" type="password" placeholder="sk-...">
  </label>
  <label>API 地址（OpenAI 兼容）
    <input id="endpoint" type="text">
  </label>
  <label>模型名
    <input id="model" type="text" list="modelList">
    <datalist id="modelList"></datalist>
  </label>
  <div class="row">
    <button id="fetchModels" class="secondary">获取模型</button>
    <button id="testConn" class="secondary">连通性测试</button>
    <button id="speedTest" class="secondary">速度测试</button>
  </div>
  <div class="row">
    <button id="save" class="secondary">保存设置</button>
    <button id="run">分析本页</button>
  </div>
  <div class="toggles">
    <label class="switch"><input id="hoverEnabled" type="checkbox"> 单词 / 词组悬浮释义</label>
    <label class="switch"><input id="shiftEnabled" type="checkbox"> 按住 Shift 查看句意</label>
    <label class="switch"><input id="ctrlEnabled" type="checkbox"> 按住 Ctrl 查看成分含义</label>
  </div>
  <div class="toggles">
    <div class="sub">调试：不按快捷键直接显示（用于排查快捷键问题）</div>
    <label class="switch"><input id="dbgSentence" type="checkbox"> 直接显示句意</label>
    <label class="switch"><input id="dbgChunk" type="checkbox"> 直接显示成分</label>
    <label class="switch"><input id="hoverPhraseOnly" type="checkbox"> 悬停只显示词组（关闭单词悬停）</label>
  </div>
  <div id="status"></div>
  <div id="diag"></div>
  <div class="hint">分析时会把页面文字发送到上面的 API 地址。鼠标悬停任意单词即可查询释义。</div>
  <script src="popup.js"></script>
</body>
</html>
